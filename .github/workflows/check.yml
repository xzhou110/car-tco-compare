# The gate (principle 8, D:/Meaningful/AI/agent-skills/rules/engineering-principles.md): every push and pull request
# runs `npm run check` (lint, typecheck, tests, build) for the app in app/. Pushes to main run the same job inside
# deploy.yml (whose build job needs it) and refresh-listings.yml (whose refresh-and-deploy job needs it), so this
# workflow covers every other branch and pull requests without running the gate twice on main.
# Copied from the engineering-audit skill's templates/check.yml on 2026-10-21; CI stays on Node 22 as in the other
# workflows of this repository (the machine runs Node 24; both pass). The check step receives the same two public
# repository variables as the deploy build (variables, not secrets: the publishable key is browser-safe), so the gate
# builds exactly what deploys; nothing in lint, typecheck or the tests reads them.
name: check

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
