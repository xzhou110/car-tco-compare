name: Deal Alerts

# PAUSED since 2026-11-12 (DECISIONS.md ADR-003): Auto.dev's terms (sections 4.2 to 4.4) do not
# allow emailing its listings to the public, so the owner stopped Deal Alerts and removed the
# daily schedule. The workflow stays runnable by hand (Run workflow) for the owner's own checks.
# Before the schedule returns there must be a written licence from Auto.dev, or a plan whose terms
# allow showing its data to end users; then restore the schedule below and the signup in the app.
# The former schedule, once daily at 15:00 UTC (8am Pacific; GitHub cron is fixed UTC, no DST):
#   schedule:
#     - cron: '0 15 * * *'
on:
  workflow_dispatch: {}

concurrency:
  group: deal-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rav4-alert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Refresh listings cache (Auto.dev → Supabase)
        id: refresh
        run: node cache-refresh.mjs
        continue-on-error: true  # quota/transient refresh failure must not block digests
        env:
          AUTODEV_API_KEY: ${{ secrets.AUTODEV_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Send confirmation emails (double opt-in)
        id: confirm
        run: node send-confirmations.mjs
        continue-on-error: true  # a confirmation hiccup must not block digests to confirmed users
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Send subscriber digests
        run: node alert-cron.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      # continue-on-error above lets the digests go out, but it also hides a failed refresh or
      # confirmation step behind a green run; `outcome` is the result before continue-on-error.
      - name: Fail the run if the refresh or confirmation step failed
        if: ${{ !cancelled() && (steps.refresh.outcome == 'failure' || steps.confirm.outcome == 'failure') }}
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          CONFIRM_OUTCOME: ${{ steps.confirm.outcome }}
        run: |
          if [ "$REFRESH_OUTCOME" = "failure" ]; then echo "::error::Refresh listings cache (cache-refresh.mjs) failed; digests still ran."; fi
          if [ "$CONFIRM_OUTCOME" = "failure" ]; then echo "::error::Send confirmation emails (send-confirmations.mjs) failed; digests still ran."; fi
          exit 1
